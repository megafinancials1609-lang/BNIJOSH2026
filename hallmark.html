<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BNI Josh 2026 - HALLMARK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0D0005;font-family:Arial,sans-serif;color:#fff}
.hdr{background:#1A0008;border-bottom:2px solid #C9A84C;padding:10px 14px;position:sticky;top:0;z-index:100}
.hdr h1{font-size:14px;font-weight:bold;color:#C9A84C}
.hdr p{font-size:9px;color:rgba(201,168,76,.5);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 14px;background:#150005}
.stat{background:#1A0008;border:1px solid rgba(201,168,76,.3);border-radius:8px;padding:8px;text-align:center}
.sn{font-size:20px;font-weight:bold;color:#C9A84C}
.sl{font-size:8px;color:rgba(201,168,76,.4);text-transform:uppercase}
.sb{padding:8px 14px;background:#150005}
.sb input{width:100%;padding:10px 12px;background:#1A0008;border:1px solid rgba(201,168,76,.4);border-radius:8px;color:#fff;font-size:14px;outline:none}
.ml{padding:6px 14px 100px}
.mc{background:#1A0008;border:1px solid rgba(201,168,76,.12);border-radius:10px;margin-bottom:8px;padding:12px}
.mc.done{border-color:#4CAF50;background:rgba(76,175,80,.05)}
.tr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sr{font-size:10px;color:rgba(201,168,76,.4);min-width:22px}
.mn{font-size:13px;font-weight:bold;flex:1}
.mc.done .mn{color:#A5D6A7}
.tw{display:flex;align-items:center;gap:5px}
.tbtn{width:48px;height:26px;border-radius:13px;border:none;cursor:pointer;position:relative}
.tbtn.off{background:#333}.tbtn.on{background:#4CAF50}
.tdot{position:absolute;width:20px;height:20px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s}
.tbtn.on .tdot{transform:translateX(22px)}
.tlbl{font-size:10px;font-weight:bold;min-width:44px;text-align:right}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.fl{font-size:9px;color:rgba(201,168,76,.5);text-transform:uppercase}
.fi{width:100%;padding:10px 11px;background:#0D0005;border:1px solid rgba(201,168,76,.2);border-radius:6px;color:#fff;font-size:14px;outline:none}
.fi:focus{border-color:#C9A84C}
.kg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.kb{background:#0D0005;border:1px solid rgba(201,168,76,.15);border-radius:6px;padding:8px}
.kl{font-size:9px;color:rgba(201,168,76,.5);text-align:center;margin-bottom:6px;text-transform:uppercase}
.kl span{display:block;font-size:8px;color:rgba(201,168,76,.3);margin-top:1px}
.kc{display:flex;align-items:center;justify-content:space-between}
.kbtn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(201,168,76,.4);background:rgba(201,168,76,.1);color:#C9A84C;font-size:22px;cursor:pointer;line-height:1}
.knum{font-size:22px;font-weight:bold;color:#C9A84C;min-width:28px;text-align:center}
.as{background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.15);border-radius:6px;padding:8px 12px;display:flex;justify-content:space-between;align-items:center}
.al{font-size:9px;color:rgba(201,168,76,.5)}
.av{font-size:15px;font-weight:bold;color:#C9A84C}
.fb{position:fixed;bottom:0;left:0;right:0;background:#1A0008;border-top:1px solid rgba(201,168,76,.3);padding:10px 14px;display:flex;gap:8px}
.sv{flex:1;padding:14px;background:#C9A84C;color:#0D0005;font-size:15px;font-weight:bold;border:none;border-radius:8px;cursor:pointer}
.exbtn{padding:14px 12px;background:transparent;color:#C9A84C;font-size:11px;font-weight:bold;border:1px solid rgba(201,168,76,.5);border-radius:8px;cursor:pointer}
.tst{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#4CAF50;color:#fff;padding:10px 24px;border-radius:20px;font-size:14px;font-weight:bold;display:none;z-index:999}
.syncing{background:#C9A84C;color:#0D0005}
.nr{text-align:center;padding:40px;color:rgba(201,168,76,.4);font-size:13px}
</style>
</head>
<body>
<div class="hdr">
  <h1>HALLMARK CHAPTER</h1>
  <p>BNI Josh 2026 | Amit Sharma & Aashish Roul</p>
</div>
<div class="stats">
  <div class="stat"><div class="sn" id="sd">0</div><div class="sl">Done</div></div>
  <div class="stat"><div class="sn" id="sp">69</div><div class="sl">Pending</div></div>
  <div class="stat"><div class="sn" id="sa">0</div><div class="sl">Amount</div></div>
</div>
<div class="sb"><input type="text" id="sch" placeholder="Search member name..." oninput="flt()" autocomplete="off"></div>
<div class="ml" id="ml"></div>
<div class="tst" id="tst">Saved!</div>
<div class="fb">
  <button class="sv" id="savebtn" onclick="sav()">SAVE & SYNC</button>
  <button class="exbtn" onclick="exp()">Export</button>
</div>
<script>
var CH="HALLMARK",RT=1800,MEM=["Agamya Shrivastava", "AISHWARY DEV SINGH", "Ajay Sahu", "Akash Chopra", "Amit Chhabria", "Amit Sharma", "ANSHUL AGRRAWAL", "Asfiya Khan", "Ashish Chauhan", "Ashish Khemani", "Ashish Raul", "Ashutosh Agrawal", "Ashutosh Onkar", "Avinash Agrawal", "Avinash Khetpal", "Ayush Agrawal", "Bhavesh Thakkar", "CA Paras Bhansali", "Chandrakant Dewangan", "Dibyendu Chakravarty", "Dipti Kumar Nayak", "GHANSHYAM SINHA", "Gulshan Kumar", "Himanshu Sahu", "Jaduvansh Sharma", "Jasmeet Singh", "Kanishka Parihar", "KARANJIT SINGH", "Kartik Dewangan", "Meghnath Dhrruv", "Mohanish Pushpakar", "Neeraj Sharma", "Nikhil Gidwani", "Nikhil Sahu", "Om Agrawal", "Om Prakash Choyal", "Parakram Singh", "Pranav Agrawal", "Preeti Barman", "Rahul Gupta", "Rahul Mangwani", "Rajesh Arya", "Ravi Andani", "Ravi  Jaisinghani", "Ravi Sachdev", "Ravi Thakur", "Ravi kumar Tuli", "ROSHAN LAL NISHAD", "SAMEER JAISWAL", "Sanjeev Shekhar Sahu", "Shyam Singhaniya", "Sona Kale", "Sourabh Sahu", "Sunil Jagyasi", "Sunita Jadwani", "Suresh Kumar Katewar", "Sushant Soni", "T Srinivas Rao", "TAJINDER SINGH SAINI", "Tikku Sahu", "TRILOCHAN SAHU", "Umang Bhawnani", "Vansh Arora", "Vinay Kumar Rana", "Vinod Kumar Sharma", "Vinod Kumar Jain", "Vivek Motwani", "Yash Gidwani", "Yashwant Verma"],D={};
var BACKEND="https://script.google.com/macros/s/AKfycbydiIc1WjcgMN0g3f2GS6Z7jQdKDonzOnvclV4OEgVbS7hJuUelFj-RZjzjSc0ikm4/exec";

function ld(){var s=localStorage.getItem("bj4_"+CH);if(s){D=JSON.parse(s);}else{for(var i=0;i<MEM.length;i++){D[i]={d:false,f:"",k0:0,k5:0};}}}

function sav(){
  localStorage.setItem("bj4_"+CH,JSON.stringify(D));
  var btn=document.getElementById("savebtn");
  btn.textContent="Syncing...";
  btn.className="sv syncing";
  
  var members=[];
  for(var i=0;i<MEM.length;i++){
    var x=D[i];
    members.push({name:MEM[i],done:x.d,family:x.f||"",kids0:x.k0||0,kids5:x.k5||0,amount:ca(i)});
  }
  
  var payload={chapter:CH,members:members};
  
  var xhr=new XMLHttpRequest();
  xhr.open("POST",BACKEND,true);
  xhr.setRequestHeader("Content-Type","text/plain");
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      btn.textContent="SAVE & SYNC";
      btn.className="sv";
      var t=document.getElementById("tst");
      t.textContent="Saved & Synced to Dashboard!";
      t.style.display="block";
      setTimeout(function(){t.style.display="none";},3000);
    }
  };
  xhr.onerror=function(){
    btn.textContent="SAVE & SYNC";
    btn.className="sv";
    var t=document.getElementById("tst");
    t.textContent="Saved locally!";
    t.style.display="block";
    setTimeout(function(){t.style.display="none";},2000);
  };
  xhr.send(JSON.stringify(payload));
  st();
}

function ca(i){var x=D[i];if(!x||!x.d)return 0;return(1+(x.f&&x.f.trim()?1:0)+(parseInt(x.k5)||0))*RT;}
function st(){var dn=0,am=0;for(var i=0;i<MEM.length;i++){if(D[i]&&D[i].d){dn++;am+=ca(i);}}document.getElementById("sd").textContent=dn;document.getElementById("sp").textContent=MEM.length-dn;document.getElementById("sa").textContent="Rs."+am.toLocaleString("en-IN");}
function tg(i){D[i].d=!D[i].d;var b=document.getElementById("tb"+i),l=document.getElementById("tl"+i),c=document.getElementById("mc"+i),n=document.getElementById("mn"+i);if(D[i].d){b.className="tbtn on";b.querySelector(".tdot").style.transform="translateX(22px)";l.textContent="Done";l.style.color="#4CAF50";c.className="mc done";n.style.color="#A5D6A7";}else{b.className="tbtn off";b.querySelector(".tdot").style.transform="none";l.textContent="Pending";l.style.color="#888";c.className="mc";n.style.color="#fff";}ua(i);}
function ck(i,t,dl){var k=t==="0"?"k0":"k5";D[i][k]=Math.max(0,Math.min(4,(parseInt(D[i][k])||0)+dl));document.getElementById("kn"+t+"_"+i).textContent=D[i][k];ua(i);}
function ua(i){var e=document.getElementById("av"+i);if(e)e.textContent="Rs."+ca(i).toLocaleString("en-IN");st();}
function rnd(ix){
  var l=document.getElementById("ml"),sh=ix||[],i,x,a,o="";
  if(!ix){for(i=0;i<MEM.length;i++)sh.push(i);}
  if(!sh.length){l.innerHTML="<div class='nr'>No results</div>";return;}
  for(var ii=0;ii<sh.length;ii++){
    i=sh[ii];x=D[i];a=ca(i);
    o+="<div class='mc "+(x.d?"done":"")+" ' id='mc"+i+"'>";
    o+="<div class='tr'><span class='sr'>"+(i+1)+".</span>";
    o+="<span class='mn' id='mn"+i+"' style='color:"+(x.d?"#A5D6A7":"#fff")+"'>"+MEM[i]+"</span>";
    o+="<div class='tw'><button class='tbtn "+(x.d?"on":"off")+"' id='tb"+i+"' onclick='tg("+i+")'><div class='tdot' style='transform:"+(x.d?"translateX(22px)":"none")+"' ></div></button>";
    o+="<span class='tlbl' id='tl"+i+"' style='color:"+(x.d?"#4CAF50":"#888")+"'>"+(x.d?"Done":"Pending")+"</span></div></div>";
    o+="<div class='fg'><span class='fl'>Family Member Name</span><input class='fi' type='text' placeholder='Type spouse name' value='"+(x.f||"")+" ' autocomplete='off' oninput='D["+i+"].f=this.value;ua("+i+")' ></div>";
    o+="<div class='kg'><div class='kb'><div class='kl'>Kids 0-5<span>FREE</span></div><div class='kc'><button class='kbtn' onclick='ck("+i+","0",-1)'>-</button><span class='knum' id='kn0_"+i+"'>"+(x.k0||0)+"</span><button class='kbtn' onclick='ck("+i+","0",1)'>+</button></div></div>";
    o+="<div class='kb'><div class='kl'>Kids 5+<span>Rs.1800 each</span></div><div class='kc'><button class='kbtn' onclick='ck("+i+","5",-1)'>-</button><span class='knum' id='kn5_"+i+"'>"+(x.k5||0)+"</span><button class='kbtn' onclick='ck("+i+","5",1)'>+</button></div></div></div>";
    o+="<div class='as'><span class='al'>Amount</span><span class='av' id='av"+i+"'>Rs."+a.toLocaleString("en-IN")+"</span></div></div>";
  }
  l.innerHTML=o;
}
function flt(){var q=document.getElementById("sch").value.toLowerCase().trim(),r=[],i;if(!q){rnd();return;}for(i=0;i<MEM.length;i++){if(MEM[i].toLowerCase().indexOf(q)>=0)r.push(i);}rnd(r);}
function exp(){
  var t="BNI JOSH 2026 - HALLMARK\nCoordinators: Amit Sharma & Aashish Roul\n"+new Date().toLocaleString("en-IN")+"\n\n",dn=[],pn=[],tot=0,i,x,a;
  for(i=0;i<MEM.length;i++){x=D[i];if(x&&x.d){a=ca(i);tot+=a;dn.push("Done: "+MEM[i]+(x.f?" + "+x.f:"")+" Rs."+a.toLocaleString("en-IN"));}else{pn.push("Pending: "+MEM[i]);}}
  t+="DONE ("+dn.length+"):\n"+dn.join("\n")+"\n\nPENDING ("+pn.length+"):\n"+pn.join("\n")+"\n\nTOTAL: Rs."+tot.toLocaleString("en-IN");
  var b=new Blob([t],{type:"text/plain"}),a2=document.createElement("a");a2.href=URL.createObjectURL(b);a2.download="HALLMARK_Summary.txt";a2.click();
}
ld();rnd();st();
</script>
</body>
</html>
